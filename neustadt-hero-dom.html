<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* DOM-версия hero — без html/body reset, всё внутри .qhero */
.qhero{
  position:relative;
  width:100%;height:100%;min-height:600px;
  display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;
  padding-top:80px;padding-bottom:240px;
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.qhero video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  display:block;
}
.qhero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(18,35,47,.15) 0%,rgba(18,35,47,.25) 50%,rgba(18,35,47,.55) 100%);
}
.qhero-content{
  position:relative;z-index:2;
  text-align:center;padding:0 40px;
  max-width:900px;width:100%;
  margin-left:auto;margin-right:auto;
}
.qhero-eyebrow{
  font-family:'Inter',sans-serif;font-size:12px;
  letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.85);font-weight:400;
  display:block;margin-bottom:20px;
  opacity:0;animation:qheroUp .8s .3s forwards;
}
.qhero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(52px,7vw,96px);
  font-weight:300;line-height:1;
  color:#fff;letter-spacing:.04em;
  margin:0 0 24px;padding:0;border:none;
  opacity:0;animation:qheroUp .9s .5s forwards;
}
.qhero-sub{
  font-family:'Inter',sans-serif;
  font-size:14px;font-weight:300;
  color:rgba(255,255,255,.72);
  line-height:1.65;max-width:480px;
  margin:0 auto 40px;
  opacity:0;animation:qheroUp .8s .7s forwards;
}
.qhero-btns{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  opacity:0;animation:qheroUp .8s .9s forwards;
}
.qhero .btn-light{
  padding:15px 32px;
  background:#fff;color:#1B3040;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;
  text-decoration:none;transition:background .2s,color .2s;
  border:none;display:inline-block;
}
.qhero .btn-light:hover{background:#B5A07A;color:#fff}
.qhero .btn-dark{
  padding:14px 32px;
  background:transparent;color:#fff;
  font-family:'Inter',sans-serif;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.55);display:inline-block;
  transition:border-color .2s,background .2s;
}
.qhero .btn-dark:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.qhero-scroll{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;animation:qheroFade 1s 1.2s forwards;z-index:2;
}
.qhero-scroll span{
  font-family:'Inter',sans-serif;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.45);
}
.qhero-scrollline{
  width:1px;height:40px;
  background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);
  animation:qheroPulse 2s infinite;
}
@keyframes qheroUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes qheroFade{from{opacity:0}to{opacity:1}}
@keyframes qheroPulse{0%,100%{opacity:.4}50%{opacity:.9}}
</style>
</head>
<body>
<div class="qhero" id="qheroRoot">

  <video autoplay muted loop playsinline preload="auto">
    <source src="https://video.wixstatic.com/video/09cf10_e732aa9ce68c4c35866fd3812bb93b9f/1080p/mp4/file.mp4" type="video/mp4">
  </video>
  <div class="qhero-overlay"></div>

  <div class="qhero-content">
    <span class="qhero-eyebrow">Neustadt in Holstein — Lübecker Bucht</span>
    <h1>Quartier am Yachthafen</h1>
    <p class="qhero-sub">Ferienwohnung als Kapitalanlage oder Eigentumswohnung zum Eigennutz — direkt am größten Yachthafen der Lübecker Bucht. 102 Einheiten. Fertigstellung Q4 2028.</p>
    <div class="qhero-btns">
      <a href="#" class="btn-light">Als Kapitalanlage</a>
      <a href="#" class="btn-dark">Zum Eigennutz</a>
    </div>
  </div>

  <div class="qhero-scroll">
    <span>Entdecken</span>
    <div class="qhero-scrollline"></div>
  </div>

</div>
<script>
var slides=[
  'https://static.wixstatic.com/media/9478fb_d13a9d3d10c040ce96bbd0d9eb7b23d5~mv2.jpg',
  'https://static.wixstatic.com/media/9478fb_86de4c95811d4847838015fad0f17713~mv2.jpg'
];
var ci=0;
var vid=document.querySelector('.qhero video');
if(!vid){
  var bg=document.getElementById('qheroRoot');
  bg.style.backgroundImage='url('+slides[0]+')';
  bg.style.backgroundSize='cover';
  bg.style.backgroundPosition='center';
}
</script>
</body>
</html>
